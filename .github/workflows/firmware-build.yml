name: ESP32 firmware build

# Builds the RecLight Link ESP-IDF firmware (OnAirLinkFirmware/) inside the
# official Espressif ESP-IDF Docker image and merges it into a single
# flashable image (dist/reclight_link_merged.bin) -- the same image
# build_firmware.sh produces locally and that flash_esp.sh / tools/flash_gui.py
# expect.
#
# Trigger manually from the Actions tab ("Run workflow"), or automatically
# on every push to main that touches the firmware. The merged .bin is
# uploaded as a workflow artifact (Actions run -> Artifacts section) --
# Actions artifacts require being signed in to the repo's GitHub to download.

on:
  push:
    branches: [ main ]
    paths:
      - 'OnAirLinkFirmware/**'
  workflow_dispatch: {}

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build firmware + merge flash image
        shell: bash
        working-directory: OnAirLinkFirmware
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py set-target esp32c3
          idf.py build
          mkdir -p dist
          esptool.py --chip esp32c3 merge_bin \
              -o dist/reclight_link_merged.bin \
              --flash_mode dio --flash_freq 80m --flash_size 2MB \
              0x0 build/bootloader/bootloader.bin \
              0x8000 build/partition_table/partition-table.bin \
              0x10000 build/reclight_link.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecLight-Link-Firmware
          path: OnAirLinkFirmware/dist/reclight_link_merged.bin
